<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Haunted House Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/bootstrap-icons.css">
    <link href="./styles.css" rel="stylesheet">
    <link rel="icon" href="/img/icon.ico" sizes="any">
</head>

<body class="background user-select-none m-0 p-0">
    <div class="startPage elshow m-0 p-0">
        <img class="coverImg" src="img/cover.png">
        <div class="startContainer">
            <div class="startBtnContainer">
                <button class="startBtn">Start Haunted House Character test</button>
            </div>
        </div>
    </div>
    <div class="testPage elhide">
        <div class="testForm">
                <h2 class="questionHeader">Question 1/8</h2>
                <div class="answerBox">
                    <button class="answer">Answer1</button>
                    <button class="answer">Answer2</button>
                </div>
                <div class="navSection">
                    <button class="nextBtn">Next question</button>
                </div>
            </div>      
    </div>
    <div class="resultPage elhide">
        <div class="testForm">
                <h1 class="questionHeader you">You are ...</h1>
                <img class="resultImg" src="">
                <br>
                <button class="reTest">Take test again</button>
            </div>      
    </div>
    <div class="chamskaReklama">
        <div class="adContainer">
            <a class="adBtn" href="https://tapas.io/series/Haunted-House/info">Tapas</a>
            <a class="adBtn" href="https://www.webtoons.com/en/canvas/haunted-house/list?title_no=997320">Webtoon</a>
            <a class="adBtn" href="https://www.instagram.com/dodo.the.artist/">Created by @dodo.the.artist</a>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
